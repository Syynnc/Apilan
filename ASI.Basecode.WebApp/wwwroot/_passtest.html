<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" />
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/screens.css">
</head><body style="padding:20px">
<div class="pass-wrap">
<article class="ticket pass" data-tilt>
<div class="ticket-body"><div class="ticket-kicker"><span class="ticket-type">Attendance pass</span><span class="ticket-org">UC</span></div>
<h3 class="ticket-title">Juan Dela Cruz</h3>
<div class="ticket-main"><div class="datepad"><span class="m">Year</span><span class="d">3</span><span class="w">BSIT</span></div>
<dl class="ticket-meta"><div><dt>No.</dt><dd class="mono">2022-00101</dd></div><div><dt>Course</dt><dd>BSIT</dd></div><div><dt>Org</dt><dd>Alliance</dd></div></dl></div>
<div class="ticket-who"><span class="pass-how">First scan times you in. The next one times you out.</span><span class="chip ok">Valid</span></div></div>
<div class="ticket-stub"><svg class="qr" viewBox="0 0 10 10"><path d="M0 0h4v4H0zM6 0h4v4H6zM0 6h4v4H0zM5 5h2v2H5z"/></svg><span class="stub-code">2022-00101</span><span class="stub-note">Show at<br/>the door</span></div>
</article></div>
<p id="out">pending</p><img id="img" style="border:3px solid red;max-width:900px">
<script src="lib/html-to-image/html-to-image.js"></script>
<script>
document.fonts.ready.then(function(){return htmlToImage.toPng(document.querySelector('.ticket'),{pixelRatio:1});})
.then(function(u){document.getElementById('img').src=u;document.getElementById('out').textContent='OK '+u.length;})
.catch(function(e){document.getElementById('out').textContent='ERR '+e;});
</script></body></html>
